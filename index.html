<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Secret Santa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #b91c1c;
    --red-dark: #7f1d1d;
    --red-bright: #dc2626;
    --gold: #d4af37;
    --gold-light: #fde68a;
    --mint: #d1fae5;
    --snow: #f1f6fb;
    --festive: 'Mountains of Christmas', Georgia, 'Times New Roman', serif;
    --scene-h: 40vh;          /* height of the hills layer */
    --ground: calc(var(--scene-h) * .29);  /* where things stand on the front hill */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    overflow: hidden;
    color: #fff;
    background-color: #0a1730;
    background-image: linear-gradient(to bottom, #050c1e 0%, #0b1d42 38%, #1a3a68 68%, #2c5784 100%);
    font-family: Georgia, 'Times New Roman', serif;
  }

  /* ---------- Layers, back to front ---------- */
  canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
  #sky { z-index: 0; }
  #aurora { z-index: 0; height: 60vh; opacity: .5; mix-blend-mode: screen; }
  .moon {
    position: fixed;
    z-index: 0;
    top: 9vh;
    right: 11vw;
    width: clamp(56px, 9vw, 110px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fffef4 0%, #f6ecc0 55%, #e3d08e 100%);
    box-shadow: 0 0 50px 14px rgba(255, 246, 200, .28), 0 0 160px 50px rgba(255, 246, 200, .1);
  }
  .moon::before, .moon::after { content: ""; position: absolute; border-radius: 50%; background: rgba(200, 180, 120, .25); }
  .moon::before { width: 22%; height: 22%; top: 30%; left: 52%; }
  .moon::after { width: 14%; height: 14%; top: 60%; left: 30%; }
  @media (max-width: 500px) { .moon { top: 66px; right: 8vw; width: 48px; } }

  .sleigh {
    position: fixed;
    z-index: 0;
    top: calc(9vh + 34px);
    left: 0;
    width: clamp(170px, 20vw, 300px);
    transform: translateX(-120%);
    animation: fly 30s linear 3s infinite;
    pointer-events: none;
  }
  .sleigh .bob { animation: bob .45s ease-in-out infinite alternate; }
  .sleigh .nose { filter: drop-shadow(0 0 3px #ff3b3b) drop-shadow(0 0 6px #ff3b3b); }
  .sleigh .trail circle { animation: blink 1s ease-in-out infinite; }

  .scene { position: fixed; z-index: 1; left: 0; right: 0; bottom: 0; height: var(--scene-h); pointer-events: none; }
  .scene svg.hill { position: absolute; left: 0; bottom: 0; width: 100%; height: 100%; }
  .scene .tree, .scene .prop { position: absolute; transform: translateX(-50%); overflow: visible; }
  .tree.far { filter: brightness(.7) saturate(.75); }
  .wide-only { display: none !important; }
  @media (min-width: 900px) and (min-height: 560px) { .wide-only { display: block !important; } }
  .cabin { left: 79%; bottom: 27%; height: 26vh; }
  .cabin .window { animation: flicker 4s ease-in-out infinite; }
  .snowman { left: 93%; bottom: 25%; height: clamp(80px, 19vh, 210px); }
  @media (max-width: 899px) { .snowman { left: 10%; bottom: 27%; } }
  .snowman .scarf-tail { animation: flap 1.1s ease-in-out infinite alternate; transform-origin: top center; transform-box: fill-box; }
  .snowman .arm { transform-origin: 100% 100%; transform-box: fill-box; transition: transform .4s; }
  .snowman.waving .arm { animation: wave .45s ease-in-out 8 alternate; }
  .print { position: absolute; width: 9px; height: 5px; border-radius: 50%; background: rgba(110, 140, 180, .45); }
  .hero-tree { left: 17%; bottom: 20%; height: 52vh; }
  .bulb { animation: blink 1.6s ease-in-out infinite; }
  .tree .bulb { animation-duration: 2.2s; }
  .star-top { animation: star-glow 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }

  #snow { z-index: 2; }
  .lights { position: fixed; z-index: 3; top: 0; left: 0; width: 100%; height: 60px; pointer-events: none; overflow: visible; }

  /* Spotlight: darkens everything except a circle around the gift */
  .dim, .beam { position: fixed; z-index: 3; pointer-events: none; opacity: 0; transition: opacity .9s ease; }
  .dim {
    inset: 0;
    background: radial-gradient(circle at var(--x, 50%) var(--y, 60%), transparent 0, transparent 150px, rgba(2, 6, 20, .72) 440px);
  }
  .beam {
    top: 0;
    left: calc(var(--x, 50%) - 230px);
    width: 460px;
    height: var(--y, 60%);
    background: linear-gradient(to bottom, rgba(255, 248, 220, 0), rgba(255, 248, 220, .28));
    clip-path: polygon(44% 0, 56% 0, 100% 100%, 0 100%);
    mix-blend-mode: screen;
  }
  .dim.on, .beam.on { opacity: 1; }
  #fireworks { z-index: 3; }

  main {
    position: fixed;
    z-index: 4;
    left: 50%;
    bottom: var(--ground);
    width: min(440px, calc(100vw - 32px));
    text-align: center;
    transform: translateX(-50%);
    transform-origin: bottom center;
  }
  #confetti { z-index: 5; }

  .footer {
    position: fixed;
    z-index: 4;
    left: 50%;
    bottom: 2.4vh;
    transform: translateX(-50%);
    padding: 9px 20px;
    border-radius: 999px;
    background: rgba(6, 15, 36, .62);
    font: 12px Arial, Helvetica, sans-serif;
    letter-spacing: 4px;
    white-space: nowrap;
    text-align: center;
    color: var(--gold-light);
  }
  @media (max-width: 500px) { .footer { padding: 8px 14px; font-size: 11px; letter-spacing: 2px; } }
  .countdown { margin-top: 6px; font: italic 14px Georgia, serif; letter-spacing: 0; color: var(--mint); }
  .countdown:empty { display: none; }

  .sound {
    position: fixed;
    z-index: 6;
    right: 14px;
    bottom: 14px;
    width: 40px;
    height: 40px;
    border: 1px solid rgba(253, 230, 138, .45);
    border-radius: 50%;
    background: rgba(6, 15, 36, .55);
    color: var(--gold-light);
    font-size: 18px;
    cursor: pointer;
  }
  .sound:hover { background: rgba(253, 230, 138, .12); }

  /* ---------- Heading ---------- */
  .eyebrow { font: 12px Arial, Helvetica, sans-serif; letter-spacing: 5px; color: var(--gold-light); }
  h1 {
    margin: 6px 0 0;
    font-family: var(--festive);
    font-size: clamp(46px, 14vw, 68px);
    line-height: 1.05;
    text-shadow: 0 3px 0 var(--red-dark), 0 0 28px rgba(255, 255, 255, .35);
  }
  .year { margin-top: 6px; font: bold 15px Arial, Helvetica, sans-serif; letter-spacing: 8px; color: var(--gold-light); }
  .greeting { margin-top: 18px; font-size: 21px; text-shadow: 0 2px 6px rgba(0, 0, 0, .5); }
  .hint {
    min-height: 1.5em;
    margin-top: 6px;
    font-style: italic;
    color: var(--mint);
    text-shadow: 0 2px 6px rgba(0, 0, 0, .5);
    transition: opacity .4s;
    animation: breathe 2.8s ease-in-out infinite;
  }
  .hint.hidden { animation: none; opacity: 0; }

  /* ---------- Gift ---------- */
  .stage { position: relative; height: 290px; margin-top: 4px; }
  .gift {
    position: absolute;
    left: 50%;
    bottom: 16px;
    width: 200px;
    height: 230px;
    margin-left: -100px;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    animation: idle 2.8s ease-in-out infinite;
  }
  .gift:focus-visible { outline: 3px solid var(--gold-light); outline-offset: 10px; border-radius: 12px; }
  .shadow {
    position: absolute;
    left: 50%;
    bottom: 4px;
    width: 240px;
    height: 30px;
    margin-left: -120px;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(20, 40, 70, .5), transparent 70%);
    transition: opacity .6s;
  }
  .box {
    position: absolute;
    left: 12px;
    bottom: 0;
    width: 176px;
    height: 150px;
    border-radius: 6px;
    background:
      linear-gradient(90deg, transparent 42%, var(--gold) 42%, var(--gold) 58%, transparent 58%),
      repeating-linear-gradient(45deg, rgba(255, 255, 255, .07) 0 8px, transparent 8px 20px),
      linear-gradient(160deg, var(--red-dark), var(--red-bright) 55%, var(--red-dark));
    box-shadow: 0 20px 40px rgba(0, 0, 0, .4), inset 0 -12px 20px rgba(0, 0, 0, .2);
    transition: box-shadow .4s;
  }
  .lid {
    position: absolute;
    left: 0;
    bottom: 140px;
    width: 200px;
    height: 44px;
    border-radius: 6px;
    background:
      linear-gradient(90deg, transparent 43%, #e8c55a 43%, #e8c55a 57%, transparent 57%),
      linear-gradient(160deg, #991b1b, #ef4444 55%, #991b1b);
    box-shadow: 0 6px 12px rgba(0, 0, 0, .3);
    transition: transform .35s cubic-bezier(.3, 1.6, .5, 1);
  }
  .seam {
    position: absolute;
    left: 6px;
    bottom: 138px;
    width: 188px;
    height: 16px;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255, 236, 160, 1), rgba(255, 210, 90, .6) 40%, transparent 70%);
    opacity: 0;
    transition: opacity .4s;
  }
  .bow {
    position: absolute;
    left: 50%;
    bottom: 26px;
    font-size: 72px;
    line-height: 1;
    transform: translateX(-50%);
    filter: drop-shadow(0 4px 4px rgba(0, 0, 0, .3));
  }
  .tag {
    position: absolute;
    top: 26px;
    right: -46px;
    padding: 5px 12px 5px 16px;
    border-radius: 4px 10px 10px 4px;
    background: #fffaf0;
    color: var(--red);
    font-family: var(--festive);
    font-size: 19px;
    font-weight: bold;
    white-space: nowrap;
    box-shadow: 0 4px 10px rgba(0, 0, 0, .35);
    transform: rotate(14deg);
    transform-origin: left center;
  }
  .tag::before {
    content: "";
    position: absolute;
    left: 6px;
    top: 50%;
    width: 6px;
    height: 6px;
    margin-top: -3px;
    border-radius: 50%;
    background: var(--gold);
  }

  /* Three-tap build-up: each level shakes harder and leaks more light from under the lid */
  .gift.lvl1 .seam { opacity: .45; }
  .gift.lvl1 .box { box-shadow: 0 20px 40px rgba(0, 0, 0, .4), 0 0 30px rgba(253, 230, 138, .25), inset 0 -12px 20px rgba(0, 0, 0, .2); }
  .gift.lvl2 .seam { opacity: 1; }
  .gift.lvl2 .lid { transform: translateY(-9px) rotate(-2deg); }
  .gift.lvl2 .box { box-shadow: 0 20px 40px rgba(0, 0, 0, .4), 0 0 60px rgba(253, 230, 138, .5), inset 0 -12px 20px rgba(0, 0, 0, .2); }
  .gift.shake1 { animation: shake1 .5s ease-in-out; }
  .gift.shake2 { animation: shake2 .65s ease-in-out; }
  .gift.shake3 { animation: shake3 .9s ease-in-out; }
  .gift.open { animation: none; cursor: default; }
  .gift.open .seam { opacity: 0; }
  .gift.open .lid { animation: lid-off 1s cubic-bezier(.3, .7, .4, 1) forwards; }
  .gift.open .box { animation: box-away .7s .35s ease-in forwards; }
  .gift.open ~ .shadow { opacity: 0; }

  /* ---------- Reveal ---------- */
  .reveal {
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    opacity: 0;
    transform: translateY(-50%) scale(.3);
    pointer-events: none;
  }
  .reveal.show { animation: pop .8s cubic-bezier(.2, .9, .3, 1.3) forwards; pointer-events: auto; }
  .reveal-label { margin-bottom: 12px; font-size: 16px; font-style: italic; color: var(--mint); text-shadow: 0 2px 6px rgba(0, 0, 0, .5); }
  .card {
    display: inline-block;
    max-width: 100%;
    padding: 22px 34px;
    border: 3px dashed var(--gold);
    border-radius: 16px;
    background: #fffaf0;
    box-shadow: 0 0 0 6px rgba(212, 175, 55, .22), 0 0 60px rgba(253, 230, 138, .35), 0 18px 40px rgba(0, 0, 0, .5);
  }
  .name {
    font-family: var(--festive);
    font-size: clamp(42px, 13vw, 60px);
    font-weight: bold;
    line-height: 1.1;
    color: var(--red);
    overflow-wrap: anywhere;
    clip-path: inset(-20px 100% -20px -20px);
  }
  /* "Handwriting": wipe the name in left to right, then let it glow */
  .reveal.write .name {
    animation: write 1.3s cubic-bezier(.5, 0, .5, 1) forwards, glow 3s ease-in-out 1.3s infinite;
  }
  .details { margin-top: 10px; font: 14px Arial, Helvetica, sans-serif; color: #4b5563; }
  .details:empty { display: none; }
  .details strong { color: #14532d; }
  .again {
    margin-top: 18px;
    padding: 8px 16px;
    border: 1px solid rgba(253, 230, 138, .5);
    border-radius: 999px;
    background: rgba(6, 15, 36, .55);
    color: var(--gold-light);
    font: 13px Arial, Helvetica, sans-serif;
    letter-spacing: 1px;
    cursor: pointer;
  }
  .again:hover { background: rgba(253, 230, 138, .12); }

  .error .stage { display: none; }

  /* ---------- Keyframes ---------- */
  @keyframes idle {
    0%, 72%, 100% { transform: rotate(0); }
    78% { transform: rotate(-3deg); }
    84% { transform: rotate(3deg); }
    90% { transform: rotate(-2deg); }
    95% { transform: rotate(1deg); }
  }
  @keyframes shake1 {
    0%, 100% { transform: rotate(0); }
    20% { transform: rotate(-4deg); }
    40% { transform: rotate(4deg); }
    60% { transform: rotate(-3deg); }
    80% { transform: rotate(2deg); }
  }
  @keyframes shake2 {
    0%, 100% { transform: translate(0) rotate(0); }
    15% { transform: translate(-4px, -6px) rotate(-6deg); }
    30% { transform: translate(4px, 0) rotate(6deg); }
    45% { transform: translate(-5px, -10px) rotate(-7deg); }
    60% { transform: translate(5px, 0) rotate(7deg); }
    80% { transform: translate(-3px, -4px) rotate(-3deg); }
  }
  @keyframes shake3 {
    0%, 100% { transform: translate(0) rotate(0); }
    10% { transform: translate(-3px, 0) rotate(-3deg); }
    20% { transform: translate(3px, -2px) rotate(3deg); }
    30% { transform: translate(-5px, 0) rotate(-5deg); }
    40% { transform: translate(5px, -3px) rotate(5deg); }
    50% { transform: translate(-7px, 0) rotate(-7deg); }
    60% { transform: translate(7px, -4px) rotate(7deg); }
    70% { transform: translate(-8px, 0) rotate(-6deg); }
    80% { transform: translate(8px, -6px) rotate(6deg) scale(1.04); }
    90% { transform: translate(0, -14px) scale(1.1); }
  }
  @keyframes lid-off { to { transform: translate(150px, -320px) rotate(70deg); opacity: 0; } }
  @keyframes box-away { to { transform: translateY(30px) scale(.85); opacity: 0; } }
  @keyframes pop {
    0% { opacity: 0; transform: translateY(-50%) scale(.3) rotate(-8deg); }
    70% { opacity: 1; transform: translateY(-50%) scale(1.1) rotate(2deg); }
    100% { opacity: 1; transform: translateY(-50%) scale(1) rotate(0); }
  }
  @keyframes write { to { clip-path: inset(-20px -20px -20px -20px); } }
  @keyframes glow {
    0%, 100% { text-shadow: 0 0 4px rgba(212, 175, 55, .35); }
    50% { text-shadow: 0 0 20px rgba(212, 175, 55, 1); }
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  @keyframes star-glow { 0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px #fde68a); } 50% { transform: scale(1.15); filter: drop-shadow(0 0 16px #fde68a); } }
  @keyframes breathe { 0%, 100% { opacity: .75; } 50% { opacity: 1; } }
  @keyframes flicker { 0%, 100% { opacity: 1; } 40% { opacity: .85; } 45% { opacity: .95; } 70% { opacity: .9; } }
  @keyframes flap { from { transform: rotate(-6deg); } to { transform: rotate(10deg); } }
  @keyframes wave { from { transform: rotate(0); } to { transform: rotate(30deg); } }
  @keyframes bob { from { transform: translateY(-1.5px); } to { transform: translateY(1.5px); } }
  @keyframes fly {
    0% { transform: translate(-25vw, 40px) rotate(-5deg); }
    45% { transform: translate(110vw, -20px) rotate(-7deg); }
    100% { transform: translate(110vw, -20px) rotate(-7deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    .sleigh { display: none; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- Three tree shapes so the forest doesn't look copy-pasted -->
    <symbol id="pine" viewBox="0 0 60 104">
      <rect x="26" y="92" width="8" height="12" fill="#3b2a1a"/>
      <polygon points="30,0 50,34 40,34 56,62 43,62 60,94 0,94 17,62 4,62 20,34 10,34" fill="currentColor"/>
      <polygon points="30,0 50,34 40,34 56,62 43,62 60,94 30,94" fill="#000" opacity=".18"/>
      <polygon points="30,0 39,15 34,13 30,17 26,13 21,15" fill="#f1f6fb"/>
      <polygon points="20,34 40,34 44,40 37,37 30,41 23,37 16,40" fill="#f1f6fb" opacity=".9"/>
      <polygon points="17,62 43,62 48,68 39,65 30,69 21,65 12,68" fill="#f1f6fb" opacity=".9"/>
    </symbol>
    <symbol id="spruce" viewBox="0 0 50 120">
      <rect x="22" y="100" width="6" height="20" fill="#3b2a1a"/>
      <polygon points="25,0 34,20 29,20 39,42 32,42 43,66 35,66 48,100 2,100 15,66 7,66 18,42 11,42 21,20 16,20" fill="currentColor"/>
      <polygon points="25,0 34,20 29,20 39,42 32,42 43,66 35,66 48,100 25,100" fill="#000" opacity=".18"/>
      <polygon points="25,0 30,11 25,9 20,11" fill="#f1f6fb"/>
      <polygon points="16,20 29,20 31,24 25,22 19,24" fill="#f1f6fb" opacity=".9"/>
      <polygon points="11,42 32,42 35,46 26,44 17,46 8,46" fill="#f1f6fb" opacity=".9"/>
    </symbol>
    <symbol id="fir" viewBox="0 0 76 84">
      <rect x="34" y="74" width="8" height="10" fill="#3b2a1a"/>
      <polygon points="38,0 58,28 50,28 70,52 60,52 76,76 0,76 16,52 6,52 26,28 18,28" fill="currentColor"/>
      <polygon points="38,0 58,28 50,28 70,52 60,52 76,76 38,76" fill="#000" opacity=".18"/>
      <polygon points="38,0 46,11 40,10 36,13 30,10" fill="#f1f6fb"/>
      <polygon points="0,76 16,52 22,55 12,62 8,70" fill="#f1f6fb" opacity=".8"/>
    </symbol>
    <radialGradient id="bauble-red" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fecaca"/><stop offset=".35" stop-color="#ef4444"/><stop offset="1" stop-color="#7f1d1d"/></radialGradient>
    <radialGradient id="bauble-gold" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fffbeb"/><stop offset=".35" stop-color="#facc15"/><stop offset="1" stop-color="#854d0e"/></radialGradient>
    <radialGradient id="bauble-blue" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#dbeafe"/><stop offset=".35" stop-color="#3b82f6"/><stop offset="1" stop-color="#1e3a8a"/></radialGradient>
    <radialGradient id="bauble-pink" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fce7f3"/><stop offset=".35" stop-color="#ec4899"/><stop offset="1" stop-color="#831843"/></radialGradient>
    <radialGradient id="bauble-silver" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#cbd5e1"/><stop offset="1" stop-color="#475569"/></radialGradient>
    <radialGradient id="snowball" cx=".38" cy=".32" r=".8"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#eef4fb"/><stop offset="1" stop-color="#b6c8dd"/></radialGradient>
  </defs>
</svg>

<canvas id="sky"></canvas>
<canvas id="aurora"></canvas>
<div class="moon" aria-hidden="true"></div>

<!-- Santa's sleigh, flying right; crosses the moon every 30s -->
<svg class="sleigh" viewBox="-40 0 300 50" aria-hidden="true">
  <g class="trail" fill="#fde68a">
    <circle cx="-8" cy="30" r="1.6"/><circle cx="-18" cy="33" r="1.2" style="animation-delay:.3s"/>
    <circle cx="-27" cy="31" r="1" style="animation-delay:.6s"/><circle cx="-35" cy="35" r=".8" style="animation-delay:.9s"/>
  </g>
  <g class="bob" fill="#030712" stroke="#030712" stroke-linecap="round">
    <!-- sleigh + Santa -->
    <path d="M6 24 L56 24 L62 38 L12 38 Z" stroke="none"/>
    <path d="M56 24 Q66 18 62 11" fill="none" stroke-width="3"/>
    <path d="M4 34 Q0 44 12 44 L62 44 Q72 44 72 37" fill="none" stroke-width="2.4"/>
    <circle cx="18" cy="19" r="8" stroke="none"/>
    <rect x="30" y="13" width="12" height="12" rx="3" stroke="none"/>
    <circle cx="37" cy="10" r="4.5" stroke="none"/>
    <path d="M33 7 L41 7 L30 1 Z" stroke="none"/>
    <!-- reins -->
    <path d="M44 18 L232 20" fill="none" stroke-width=".8"/>
    <!-- reindeer -->
    <g transform="translate(92 6)"><use href="#deer"/></g>
    <g transform="translate(140 4)"><use href="#deer"/></g>
    <g transform="translate(190 6)"><use href="#deer"/><circle class="nose" cx="38.6" cy="9" r="2" fill="#ff3b3b" stroke="none"/></g>
  </g>
  <defs>
    <g id="deer">
      <ellipse cx="18" cy="16" rx="12" ry="5" stroke="none"/>
      <path d="M27 13 L33 6 L38 7 L38.5 10 L33 11 L30 17 Z" stroke="none"/>
      <path d="M33 6 L31 0 M32 3 L29 1.5 M35 6 L37 0 M36 3 L39 2" fill="none" stroke-width="1.2"/>

<main id="main">
  <div class="eyebrow">YOU'VE BEEN ASSIGNED</div>

  &#129323; SHH&hellip; KEEP IT SECRET

<script>
  // Links look like  index.html#<payload>. The payload is JSON
  //   {g: gifter, r: receiver, y: year, b?: budget, d?: exchange date}
  // XOR-scrambled with KEY and base64url-encoded. It must match reveal_link() in SecretSanta.py.
  // This only stops the name being readable at a glance - it is not encryption.
  const KEY = "ho-ho-ho";

  const $ = (id) => document.getElementById(id);
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const rand = (min, max) => Math.random() * (max - min) + min;
  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, reduceMotion ? 0 : ms));

  function decode(payload) {
    let b64 = payload.replace(/-/g, "+").replace(/_/g, "/");
    while (b64.length % 4) b64 += "=";
    const key = new TextEncoder().encode(KEY);
    const bytes = Uint8Array.from(atob(b64), (c, i) => c.charCodeAt(0) ^ key[i % key.length]);
    return JSON.parse(new TextDecoder().decode(bytes));
  }

  let match = null;
  try {
    match = decode(location.hash.slice(1));
    if (!match.g || !match.r) throw new Error("incomplete");
  } catch {
    match = null;
  }

  const year = (match && match.y) || new Date().getFullYear();
  $("year").textContent = `— ${year} —`;
  if (match) {
    $("greeting").textContent = `Hi ${match.g},`;
    $("tag").textContent = `To: ${match.g}`;
    $("name").textContent = match.r;
    const details = [["Budget", match.b], ["Exchange", match.d]].filter(([, v]) => v);
    details.forEach(([label, value], i) => {
      if (i) $("details").append(" · ");
      const strong = document.createElement("strong");
      strong.textContent = `${label}: `;
      $("details").append(strong, value);
    });
    document.title = `Secret Santa ${year}`;
  } else {
    $("main").classList.add("error");
    $("greeting").textContent = "Hmm, this link looks incomplete.";
    $("hint").textContent = "Open the link straight from your Secret Santa email.";
  }

  // ---------- Layout: stand everything on the snow, scaled to the screen ----------
  function layout() {
    const main = $("main");
    main.style.transform = "translateX(-50%)";
    const ground = innerHeight * 0.4 * 0.29;
    const available = innerHeight - ground - 64;  // keep clear of the fairy lights
    let scale = Math.min(available / main.offsetHeight, (innerWidth - 16) / main.offsetWidth, 1.55);
    scale = Math.max(scale, 0.6);
    main.style.transform = `translateX(-50%) scale(${scale})`;
  }
  layout();
  addEventListener("resize", layout);
  if (document.fonts) document.fonts.ready.then(layout);

  // ---------- Christmas countdown ----------
  (function countdown() {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const days = Math.round((new Date(now.getFullYear(), 11, 25) - today) / 86400000);
    $("countdown").textContent =
      days > 1 ? `\u{1F384} ${days} sleeps until Christmas` :
      days === 1 ? "\u{1F384} Just one more sleep until Christmas!" :
      days === 0 ? "\u{1F384} Merry Christmas!" : "";
  })();

  // ---------- Sound (synthesised, no audio files) ----------
  let muted = false;
  try { muted = localStorage.getItem("santa-muted") === "1"; } catch {}
  const soundBtn = $("sound");
  const showSound = () => {
    soundBtn.textContent = muted ? "\u{1F507}" : "\u{1F50A}";
    soundBtn.setAttribute("aria-label", muted ? "Unmute sound" : "Mute sound");
  };
  showSound();
  soundBtn.addEventListener("click", () => {
    muted = !muted;
    try { localStorage.setItem("santa-muted", muted ? "1" : "0"); } catch {}
    showSound();
  });

  let audio = null;
  function tone(freq, start, length, volume, type = "sine") {
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, start);
    gain.gain.linearRampToValueAtTime(volume, start + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + length);
    osc.connect(gain).connect(audio.destination);
    osc.start(start);
    osc.stop(start + length + 0.05);
  }
  function play(kind, level = 1) {
    if (muted) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const t = audio.currentTime;
      if (kind === "jingle") {
        // sleigh bells; more and louder with each tap
        for (let i = 0; i < 5 + level * 4; i++) {
          const at = t + i * 0.055 + rand(0, 0.02);
          tone(rand(2600, 3600), at, 0.12, 0.025 + level * 0.015);
          tone(rand(4200, 5200), at, 0.08, 0.015 + level * 0.008);
        }
      } else if (kind === "chime") {
        [1046.5, 1318.5, 1568, 2093, 2637].forEach((f, i) => {
          tone(f, t + i * 0.08, 1.4, 0.12, "triangle");
          tone(f * 2, t + i * 0.08, 0.6, 0.03);
        });
      } else if (kind === "pop") {
        const length = 0.35;
        const buffer = audio.createBuffer(1, audio.sampleRate * length, audio.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length) ** 4;
        const src = audio.createBufferSource();
        const filter = audio.createBiquadFilter();
        const gain = audio.createGain();
        src.buffer = buffer;
        filter.type = "lowpass";
        filter.frequency.value = rand(700, 1400);
        gain.gain.value = 0.18;
        src.connect(filter).connect(gain).connect(audio.destination);
        src.start();
      }
    } catch {}
  }

  // ---------- Unwrap: three taps, then the big reveal ----------
  const gift = $("gift");
  const reveal = $("reveal");
  const HINTS = ["Tap the gift to unwrap your match", "Ooh, something's rattling… keep going!", "One more tap!"];
  let taps = 0;
  let busy = false;

  function shake(cls, ms) {
    gift.classList.add(cls);
    return wait(ms).then(() => gift.classList.remove(cls));
  }

  gift.addEventListener("click", async () => {
    if (busy || taps >= 3 || !match) return;
    busy = true;
    taps++;
    play("jingle", taps);
    if (navigator.vibrate) navigator.vibrate(taps < 3 ? [25 * taps, 40, 25 * taps] : [30, 50, 30, 50, 30, 50, 90]);

    if (taps < 3) {
      gift.classList.add(`lvl${taps}`);
      $("hint").textContent = HINTS[taps];
      await shake(`shake${taps}`, taps === 1 ? 500 : 650);
      busy = false;
      return;
    }

    $("hint").classList.add("hidden");
    spotlight(true);
    await shake("shake3", 900);
    gift.classList.add("open");
    await wait(450);
    reveal.classList.add("show");
    await wait(500);
    reveal.classList.add("write");
    play("chime");
    burstConfetti();
    $("snowman").classList.add("waving");
    launchFireworks();
    busy = false;
  });

  function spotlight(on) {
    const r = gift.getBoundingClientRect();
    for (const el of [$("dim"), $("beam")]) {
      el.style.setProperty("--x", `${r.left + r.width / 2}px`);
      el.style.setProperty("--y", `${r.top + r.height / 2}px`);
      el.classList.toggle("on", on);
    }
  }

  $("again").addEventListener("click", () => {
    reveal.classList.remove("show", "write");
    gift.classList.remove("open", "lvl1", "lvl2");
    $("snowman").classList.remove("waving");
    $("hint").textContent = HINTS[0];
    $("hint").classList.remove("hidden");
    spotlight(false);
    taps = 0;
  });

  // ---------- Scenery ----------
  const SVG_NS = "http://www.w3.org/2000/svg";
  const svgEl = (tag, attrs) => {
    const el = document.createElementNS(SVG_NS, tag);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    return el;
  };
  const BULB_COLORS = ["#ef4444", "#facc15", "#22c55e", "#3b82f6", "#ec4899"];
  const SHAPES = { pine: "0 0 60 104", spruce: "0 0 50 120", fir: "0 0 76 84" };

  // [left %, bottom % of the scene, height vh, shape, far?, lit?]
  const TREES = [
    [3, 47, 13, "spruce", 1, 0], [8, 51, 8, "fir", 1, 0], [13, 43, 15, "pine", 0, 1], [26, 52, 9, "spruce", 1, 0],
    [31, 49, 7, "fir", 1, 0], [36, 46, 11, "pine", 1, 0], [63, 50, 9, "fir", 1, 0], [68, 47, 13, "spruce", 1, 0],
    [74, 52, 8, "pine", 1, 0], [86, 46, 14, "spruce", 0, 1], [91, 51, 9, "fir", 1, 0], [97, 44, 16, "pine", 0, 1],
  ];
  for (const [left, bottom, height, shape, far, lit] of TREES) {
    const tree = svgEl("svg", { class: `tree${far ? " far" : ""}`, viewBox: SHAPES[shape] });
    tree.style.cssText = `left:${left}%;bottom:${bottom}%;height:${height}vh;color:${far ? "#1b4b3a" : "#0f3d2e"}`;
    tree.append(svgEl("use", { href: `#${shape}` }));
    if (lit) {
      [[24, 46], [36, 52], [18, 76], [30, 80], [42, 74], [28, 28]].forEach(([cx, cy], i) => {
        const bulb = svgEl("circle", { cx, cy, r: 2.6, fill: BULB_COLORS[i % BULB_COLORS.length], class: "bulb" });
        bulb.style.animationDelay = `${rand(0, 2)}s`;
        tree.append(bulb);
      });
    }
    $("trees").append(tree);
  }

  // Big decorated tree (wide screens only): shaded tiers, wrapping garlands, glossy baubles
  (function heroTree() {
    const tree = svgEl("svg", { class: "tree hero-tree wide-only", viewBox: "0 -8 100 150" });
    const tiers = [[50, 6, 26, 48], [50, 28, 36, 80], [50, 54, 46, 116]];
    for (const [x, top, half, bottom] of tiers) {
      tree.append(svgEl("polygon", { points: `${x},${top} ${x + half},${bottom} ${x - half},${bottom}`, fill: "#166534" }));
      tree.append(svgEl("polygon", { points: `${x},${top} ${x + half},${bottom} ${x},${bottom}`, fill: "#0f3d24", opacity: 0.55 }));
      // scalloped snow along each tier's lower edge
      let d = `M${x - half} ${bottom}`;
      for (let i = 0; i < 6; i++) {
        const x1 = x - half + ((i + 1) * 2 * half) / 6;
        d += ` Q${x1 - half / 6} ${bottom + 4} ${x1} ${bottom}`;
      }
      tree.append(svgEl("path", { d: `${d} L${x - half} ${bottom} Z`, fill: "#f1f6fb", opacity: 0.9 }));
    }
    tree.prepend(svgEl("rect", { x: 44, y: 114, width: 12, height: 22, fill: "#4a2c17" }));
    // garlands dip downwards like they wrap around the front
    ["M30 40 Q52 54 72 36", "M20 70 Q48 88 82 64", "M10 104 Q46 124 92 98"].forEach((d) =>
      tree.append(svgEl("path", { d, fill: "none", stroke: "#fde68a", "stroke-width": 1.6, opacity: 0.9 })));
    const fills = ["red", "gold", "blue", "pink", "silver"];
    [[44, 30], [58, 38], [36, 58], [62, 56], [50, 70], [28, 84], [72, 80], [44, 94], [20, 108], [60, 104], [82, 108], [36, 110]]
      .forEach(([cx, cy], i) => tree.append(svgEl("circle", { cx, cy, r: 3.8, fill: `url(#bauble-${fills[i % fills.length]})` })));
    [[40, 44], [56, 26], [70, 66], [30, 72], [54, 88], [76, 96], [26, 98], [48, 112]].forEach(([cx, cy], i) => {
      const bulb = svgEl("circle", { cx, cy, r: 1.6, fill: "#fff7d6", class: "bulb" });
      bulb.style.animationDelay = `${i * 0.27}s`;
      tree.append(bulb);
    });
    tree.append(svgEl("polygon", {
      points: "50,-7 53,1 61,1 55,6 57,14 50,9 43,14 45,6 39,1 47,1", fill: "#facc15", class: "star-top",
    }));
    $("trees").append(tree);
  })();

  // Footprints from the cabin door to the gift
  (function footprints() {
    const [x0, y0, cx, cy, x1, y1] = [77, 22, 68, 14, 57, 24];
    for (let i = 0; i < 16; i++) {
      const t = i / 15;
      const x = (1 - t) ** 2 * x0 + 2 * (1 - t) * t * cx + t ** 2 * x1;
      const y = (1 - t) ** 2 * y0 + 2 * (1 - t) * t * cy + t ** 2 * y1;
      const print = document.createElement("span");
      print.className = "print";
      print.style.cssText = `left:${x}%;bottom:calc(${y}% + ${i % 2 ? 5 : -5}px);transform:rotate(${i % 2 ? -12 : 12}deg)`;
      $("prints").append(print);
    }
  })();

  // ---------- Fairy lights along the top ----------
  function drawLights() {
    const svg = $("lights");
    svg.replaceChildren();
    const w = innerWidth;
    const span = w < 500 ? 110 : 150;
    const sag = 26;
    let d = "M0 4";
    let i = 0;
    for (let x = 0; x < w; x += span) {
      const x2 = x + span;
      d += ` Q${x + span / 2} ${4 + sag * 2} ${x2} 4`;
      for (const t of [0.2, 0.4, 0.6, 0.8]) {
        const px = (1 - t) ** 2 * x + 2 * (1 - t) * t * (x + span / 2) + t ** 2 * x2;
        const py = (1 - t) ** 2 * 4 + 2 * (1 - t) * t * (4 + sag * 2) + t ** 2 * 4;
        const color = BULB_COLORS[i++ % BULB_COLORS.length];
        const g = svgEl("g", { transform: `translate(${px} ${py})` });
        g.append(svgEl("rect", { x: -2.5, y: 0, width: 5, height: 5, rx: 1, fill: "#2d3748" }));
        const bulb = svgEl("ellipse", { cx: 0, cy: 11, rx: 4.5, ry: 7, fill: color, class: "bulb" });
        bulb.style.filter = `drop-shadow(0 0 6px ${color})`;
        bulb.style.animationDelay = `${rand(0, 1.6)}s`;
        g.append(bulb);
        svg.append(g);
      }
    }
    svg.prepend(svgEl("path", { d, fill: "none", stroke: "#334155", "stroke-width": 2 }));
  }
  drawLights();
  addEventListener("resize", drawLights);

  // ---------- Canvas helpers ----------
  function fitCanvas(canvas, scale = 1) {
    const ctx = canvas.getContext("2d");
    const resize = () => {
      const dpr = (window.devicePixelRatio || 1) * scale;
      canvas.width = Math.ceil(canvas.clientWidth * dpr);
      canvas.height = Math.ceil(canvas.clientHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    resize();
    addEventListener("resize", resize);
    return ctx;
  }

  // ---------- Stars + shooting stars ----------
  const sky = fitCanvas($("sky"));
  const stars = Array.from({ length: 160 }, () => ({
    x: Math.random(), y: Math.random() * 0.62, r: rand(0.4, 1.6), phase: rand(0, 6.3), speed: rand(0.6, 2),
  }));
  let shooting = null;
  let nextShot = performance.now() + rand(2500, 5000);

  function drawSky(now) {
    sky.clearRect(0, 0, innerWidth, innerHeight);
    for (const s of stars) {
      const a = reduceMotion ? 0.8 : 0.45 + 0.55 * Math.abs(Math.sin(now / 1000 * s.speed + s.phase));
      sky.fillStyle = `rgba(255, 255, 240, ${a})`;
      sky.beginPath();
      sky.arc(s.x * innerWidth, s.y * innerHeight, s.r, 0, Math.PI * 2);
      sky.fill();
    }
    if (reduceMotion) return;
    if (!shooting && now > nextShot) {
      shooting = { x: rand(0.05, 0.6) * innerWidth, y: rand(0.03, 0.25) * innerHeight, start: now };
    }
    if (shooting) {
      const t = (now - shooting.start) / 900;
      if (t >= 1) {
        shooting = null;
        nextShot = now + rand(5000, 11000);
      } else {
        const len = 140;
        const hx = shooting.x + t * 420;
        const hy = shooting.y + t * 160;
        const grad = sky.createLinearGradient(hx, hy, hx - len, hy - len * 0.38);
        grad.addColorStop(0, `rgba(255, 255, 255, ${1 - t})`);
        grad.addColorStop(1, "rgba(255, 255, 255, 0)");
        sky.strokeStyle = grad;
        sky.lineWidth = 2;
        sky.beginPath();
        sky.moveTo(hx, hy);
        sky.lineTo(hx - len, hy - len * 0.38);
        sky.stroke();
      }
    }
    requestAnimationFrame(drawSky);
  }
  requestAnimationFrame(drawSky);

  // ---------- Northern lights ----------
  // Drawn at 1/8 resolution and stretched by CSS, which gives the soft blur for free.
  const aurora = fitCanvas($("aurora"), 1 / 8);
  const RIBBONS = [
    { y: 0.32, amp: 0.1, freq: 1.3, speed: 0.00011, h: 0.34, rgb: "70, 255, 170" },
    { y: 0.22, amp: 0.08, freq: 2.1, speed: -0.00008, h: 0.28, rgb: "110, 210, 255" },
    { y: 0.42, amp: 0.07, freq: 0.9, speed: 0.00014, h: 0.22, rgb: "190, 120, 255" },
  ];
  let lastAurora = 0;
  function drawAurora(now) {
    if (now - lastAurora > 33) {  // ~30fps is plenty for something this slow
      lastAurora = now;
      const w = $("aurora").clientWidth;
      const h = $("aurora").clientHeight;
      aurora.clearRect(0, 0, w, h);
      for (const r of RIBBONS) {
        for (let x = 0; x < w; x += 8) {
          const u = x / w;
          const top = (r.y + r.amp * Math.sin(u * r.freq * Math.PI * 2 + now * r.speed)
            + 0.03 * Math.sin(u * 11 + now * r.speed * 4)) * h;
          const shimmer = 0.55 + 0.45 * Math.sin(u * 23 + now * 0.0009);
          const grad = aurora.createLinearGradient(0, top, 0, top + r.h * h);
          grad.addColorStop(0, `rgba(${r.rgb}, 0)`);
          grad.addColorStop(0.3, `rgba(${r.rgb}, ${0.55 * shimmer})`);
          grad.addColorStop(1, `rgba(${r.rgb}, 0)`);
          aurora.fillStyle = grad;
          aurora.fillRect(x, top, 9, r.h * h);
        }
      }
    }
    if (!reduceMotion) requestAnimationFrame(drawAurora);
  }
  requestAnimationFrame(drawAurora);

  // ---------- Snow, chimney smoke, glints on the snow ----------
  const snow = fitCanvas($("snow"));
  const flakes = Array.from({ length: reduceMotion ? 0 : 120 }, () => ({
    x: Math.random() * innerWidth, y: Math.random() * innerHeight, r: rand(0.8, 3.2), speed: rand(0.3, 1), drift: rand(0, 6.3),
  }));
  const glints = Array.from({ length: 36 }, () => ({ x: Math.random(), y: rand(0, 0.11), phase: rand(0, 6.3), speed: rand(0.4, 1.2) }));
  let smoke = [];
  let lastPuff = 0;

  (function fall(now = 0) {
    snow.clearRect(0, 0, innerWidth, innerHeight);

    // smoke rises from the chimney marker inside the cabin SVG (if the cabin is showing)
    const chimney = $("chimney").getBoundingClientRect();
    if (chimney.top > 0 && !reduceMotion && now - lastPuff > 140) {
      lastPuff = now;
      smoke.push({ x: chimney.left, y: chimney.top, r: rand(3, 5), a: 0.38, vx: rand(0.15, 0.35), vy: rand(-0.55, -0.35) });
    }
    for (const p of smoke) {
      p.x += p.vx + Math.sin((p.y + now * 0.02) / 30) * 0.15;
      p.y += p.vy;
      p.r += 0.07;
      p.a -= 0.0016;
      snow.fillStyle = `rgba(205, 215, 230, ${Math.max(p.a, 0)})`;
      snow.beginPath();
      snow.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      snow.fill();
    }
    smoke = smoke.filter((p) => p.a > 0);

    snow.fillStyle = "rgba(255, 255, 255, .85)";
    for (const f of flakes) {
      f.y += f.speed;
      f.drift += 0.01;
      f.x += Math.sin(f.drift) * 0.4;
      if (f.y > innerHeight + 5) { f.y = -5; f.x = Math.random() * innerWidth; }
      snow.beginPath();
      snow.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      snow.fill();
    }

    // little sparkles on the snow that flash now and then
    snow.strokeStyle = "rgba(255, 255, 255, .95)";
    snow.lineWidth = 1;
    for (const g of glints) {
      const a = Math.max(0, Math.sin(now / 1000 * g.speed + g.phase)) ** 12;
      if (a < 0.05) continue;
      const x = g.x * innerWidth;
      const y = innerHeight - g.y * innerHeight;
      const s = 4 * a;
      snow.globalAlpha = a;
      snow.beginPath();
      snow.moveTo(x - s, y); snow.lineTo(x + s, y);
      snow.moveTo(x, y - s); snow.lineTo(x, y + s);
      snow.stroke();
    }
    snow.globalAlpha = 1;

    if (!reduceMotion) requestAnimationFrame(fall);
  })();

  // ---------- Fireworks (behind the card, over the dimmed sky) ----------
  const fw = fitCanvas($("fireworks"));
  const FW_COLORS = ["#fde68a", "#f87171", "#4ade80", "#60a5fa", "#f472b6", "#ffffff"];
  let rockets = [];
  let sparks = [];
  let fwRunning = false;

  function launchFireworks() {
    if (reduceMotion) return;
    for (let i = 0; i < 7; i++) {
      setTimeout(() => {
        const x = innerWidth * rand(0.15, 0.85);
        rockets.push({
          x, y: innerHeight * 0.75,
          tx: x + rand(-60, 60), ty: innerHeight * rand(0.1, 0.38),
          t: 0, color: FW_COLORS[i % FW_COLORS.length],
        });
        if (!fwRunning) { fwRunning = true; requestAnimationFrame(drawFireworks); }
      }, i * 420);
    }
  }

  function drawFireworks() {
    fw.clearRect(0, 0, innerWidth, innerHeight);
    for (const r of rockets) {
      r.t += 0.025;
      const ease = 1 - (1 - r.t) ** 2;
      const x = r.x + (r.tx - r.x) * ease;
      const y = r.y + (r.ty - r.y) * ease;
      fw.fillStyle = "#fff7d6";
      fw.beginPath();
      fw.arc(x, y, 2, 0, Math.PI * 2);
      fw.fill();
      sparks.push({ x, y, vx: rand(-0.3, 0.3), vy: rand(0.2, 0.8), a: 0.6, color: "#fde68a", size: 1.2 });
      if (r.t >= 1) {
        play("pop");
        const count = 70;
        for (let i = 0; i < count; i++) {
          const angle = (i / count) * Math.PI * 2;
          const speed = rand(1.5, 4.2);
          sparks.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, a: 1, color: r.color, size: rand(1.4, 2.4) });
        }
      }
    }
    rockets = rockets.filter((r) => r.t < 1);
    for (const s of sparks) {
      s.vx *= 0.98;
      s.vy = s.vy * 0.98 + 0.04;
      s.x += s.vx;
      s.y += s.vy;
      s.a -= 0.012;
      fw.globalAlpha = Math.max(s.a, 0);
      fw.fillStyle = s.color;
      fw.beginPath();
      fw.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      fw.fill();
    }
    fw.globalAlpha = 1;
    sparks = sparks.filter((s) => s.a > 0);
    if (rockets.length || sparks.length) requestAnimationFrame(drawFireworks);
    else { fwRunning = false; fw.clearRect(0, 0, innerWidth, innerHeight); }
  }

  // ---------- Confetti ----------
  const confetti = fitCanvas($("confetti"));
  const COLORS = ["#dc2626", "#d4af37", "#fde68a", "#16a34a", "#ffffff"];
  let pieces = [];

  function burstConfetti() {
    if (reduceMotion) return;
    const rect = gift.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const start = pieces.length === 0;
    for (let i = 0; i < 200; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = rand(4, 13);
      pieces.push({
        x: cx, y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 6,
        w: rand(5, 13),
        h: rand(3, 8),
        rot: Math.random() * Math.PI,
        spin: (Math.random() - 0.5) * 0.4,
        color: COLORS[i % COLORS.length],
      });
    }
    if (start) requestAnimationFrame(drawConfetti);
  }

  function drawConfetti() {
    confetti.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of pieces) {
      p.vy += 0.25;
      p.vx *= 0.99;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.spin;
      confetti.save();
      confetti.translate(p.x, p.y);
      confetti.rotate(p.rot);
      confetti.fillStyle = p.color;
      confetti.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.rot * 2)));
      confetti.restore();
    }
    pieces = pieces.filter((p) => p.y < innerHeight + 20);
    if (pieces.length) requestAnimationFrame(drawConfetti);
    else confetti.clearRect(0, 0, innerWidth, innerHeight);
  }
</script>
</body>
</html>
